name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/Jibet-debug.apk

      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Jibet-debug.apk
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
          else
            git commit -m "build: توزیع خودکار APK [skip ci]"
            git push
          fi

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "آخرین نسخه — Jibet"
          body: "فایل APK را دانلود و نصب کنید. برای نصب، اجازه نصب از منابع ناشناس را در تنظیمات فعال کنید."
          files: apk/Jibet-debug.apk
          make_latest: true
