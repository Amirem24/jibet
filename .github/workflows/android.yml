name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        run: |
          echo "$JB_KEYSTORE_B64" | base64 -d > /tmp/jibet-release.jks
          echo "JB_KEYSTORE_PATH=/tmp/jibet-release.jks" >> "$GITHUB_ENV"
          echo "JB_STORE_PASSWORD=$JB_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "JB_KEY_ALIAS=$JB_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "JB_KEY_PASSWORD=$JB_KEY_PASSWORD" >> "$GITHUB_ENV"
        env:
          JB_KEYSTORE_B64: ${{ secrets.JB_KEYSTORE_B64 }}
          JB_STORE_PASSWORD: ${{ secrets.JB_STORE_PASSWORD }}
          JB_KEY_ALIAS: ${{ secrets.JB_KEY_ALIAS }}
          JB_KEY_PASSWORD: ${{ secrets.JB_KEY_PASSWORD }}

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      # versionCode همیشه یکتا و صعودی: ۱۰۰ + شماره‌ی ران CI
      # نسخه‌ی نمایشی (versionName) از فایل gradle خوانده می‌شود
      - name: Build signed release APK
        run: >
          gradle :app:assembleRelease --stacktrace
          -PjibetVersionCode=$((100 + GITHUB_RUN_NUMBER))

      - name: Verify signature
        run: |
          APKS=$ANDROID_HOME/build-tools/35.0.0/apksigner
          $APKS verify --print-certs app/build/outputs/apk/release/app-release.apk | head -4

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Jibet.apk

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "آخرین نسخه — Jibet"
          body: |
            نصب: فایل APK را دانلود و نصب کنید. برای نصب، اجازه نصب از منابع ناشناس را در تنظیمات فعال کنید.

            به‌روزرسانی: امضای این نسخه پایدار است — نصب نسخه جدید روی نسخه قبلی بدون حذف اپ و بدون از دست رفتن داده‌ها انجام می‌شود.
          files: dist/Jibet.apk
          make_latest: true
